name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Run test suite
        # Zero dependencies — nothing to install. On Node 18/20 the store
        # layer automatically uses the portable JSON backend; on 22 the
        # SQLite backend (node:sqlite) is exercised by the same suite.
        run: npm test
